extends: default

rules:
  # Les workflows GitHub Actions n'ont pas de marqueur de début de document.
  document-start: disable
  line-length:
    max: 120
  # « on: » est la clé de déclenchement des workflows, pas un booléen.
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
  comments:
    min-spaces-from-content: 1
