default_install_hook_types:
  - pre-commit
  - commit-msg
default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^static/vendor/
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^static/vendor/

  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      # Utilise la version de gitleaks fixée dans mise.toml.
      - id: gitleaks-system
        pass_filenames: false

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 81d3af62ea96a1f69f0cfa8745f253d3c4740896  # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [build, chore, ci, docs, feat, fix, perf, refactor, revert, test]

  # ShellCheck et actionlint viennent de mise.toml, aux mêmes versions sur le poste et en CI.
  # actionlint passe aussi les blocs « run » des workflows à ShellCheck.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint-system

  # ruff et prettier viennent de requirements-dev.txt et de package.json (mise run deps) :
  # une seule version de chaque outil, la même sur le poste et en CI.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (analyse)
        entry: ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff (format)
        entry: ruff format
        language: system
        types: [python]

      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write
        language: system
        files: ^(static/js|tests)/.*\.js$

      - id: node-check
        name: node --check
        entry: bash -c 'for script in "$@"; do node --check "$script" || exit 1; done' --
        language: system
        files: ^static/js/.*\.js$
