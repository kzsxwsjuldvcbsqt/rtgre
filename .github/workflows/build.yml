name: Build and Deploy Schedule Site

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Set up Node.js for tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF verification tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check formatting and syntax
        run: |
          ruff check src tests
          ruff format --check src tests
          npm run format:check
          for script in static/js/*.js; do node --check "$script"; done

      - name: Verify PDF assets
        run: sha256sum --check static/PDF-ASSETS.sha256

      - name: Run JavaScript tests
        run: npm test

      - name: Run Python and browser tests
        timeout-minutes: 10
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-reports
          path: test-artifacts/
          if-no-files-found: ignore

      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt
          npm audit

      - name: Build static site
        run: |
          PYTHONPATH=src python -m schedule.build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
