name: Build and Deploy Schedule Site

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      automatic:
        description: Started by the update timer rather than by a person
        type: boolean
        default: false

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: '2026.11.11'
  EX_TEMPFAIL: 75
  STALE_AFTER_HOURS: 24
  AUTOMATIC: ${{ github.event_name == 'schedule' || inputs.automatic == true }}

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      built: ${{ steps.site.outputs.status == '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Python, Node et uv aux versions de mise.toml, les mêmes que sur le poste.
      - name: Install pinned tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: python node uv

      - name: Install dependencies
        run: mise run deps

      - name: Run JavaScript tests
        run: npm test

      - name: Run Python and browser tests
        timeout-minutes: 10
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-reports
          path: test-artifacts/
          if-no-files-found: ignore

      - name: Build static site
        id: site
        run: |
          status=0
          PYTHONPATH=src python -m schedule.build || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne "$EX_TEMPFAIL" ] || [ "$AUTOMATIC" != "true" ]; then
            exit "$status"
          fi

      - name: Keep the published site while ADE is unreachable
        if: steps.site.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=1" \
            --jq '.[0].created_at')
          age=$(( ($(date +%s) - $(date --date "$published" +%s)) / 3600 ))
          if [ "$age" -ge "$STALE_AFTER_HOURS" ]; then
            echo "::error::ADE is unreachable and the site has not been published for $age hours"
            exit 1
          fi
          echo "::warning::ADE is unreachable, the site published $age hours ago is kept"

      - name: Upload Pages artifact
        if: steps.site.outputs.status == '0'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  keepalive:
    name: Keep scheduled workflows enabled
    if: github.event_name == 'schedule' || inputs.automatic == true
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable the workflows of this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq '.workflows[] | select(.path | startswith(".github/workflows/")) | .id' |
            while read -r workflow; do
              gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"
            done

  deploy:
    name: Deploy to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name != 'pull_request' && needs.build.outputs.built == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
