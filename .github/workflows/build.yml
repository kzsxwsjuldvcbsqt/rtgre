name: Build and Deploy Schedule Site

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '0 5-18 * * 1-5'
    - cron: '0 0,21 * * 1-5'
    - cron: '0 */6 * * 0,6'
  workflow_dispatch:

permissions:
  contents: read

env:
  EX_TEMPFAIL: 75
  STALE_AFTER_HOURS: 24

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      built: ${{ steps.site.outputs.status == '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Set up Node.js for tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check formatting and syntax
        run: |
          ruff check src tests
          ruff format --check src tests
          npm run format:check
          for script in static/js/*.js; do node --check "$script"; done

      - name: Run JavaScript tests
        run: npm test

      - name: Run Python and browser tests
        timeout-minutes: 10
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-reports
          path: test-artifacts/
          if-no-files-found: ignore

      - name: Build static site
        id: site
        run: |
          status=0
          PYTHONPATH=src python -m schedule.build || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne "$EX_TEMPFAIL" ] || [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            exit "$status"
          fi

      - name: Keep the published site while ADE is unreachable
        if: steps.site.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=1" --jq '.[0].created_at')
          age=$(( ($(date +%s) - $(date --date "$published" +%s)) / 3600 ))
          if [ "$age" -ge "$STALE_AFTER_HOURS" ]; then
            echo "::error::ADE is unreachable and the site has not been published for $age hours"
            exit 1
          fi
          echo "::warning::ADE is unreachable, the site published $age hours ago is kept"

      - name: Upload Pages artifact
        if: steps.site.outputs.status == '0'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name != 'pull_request' && needs.build.outputs.built == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
